site_name: apmodel
site_description: ActivityStreams 2.0 / ActivityPub model library for Python
site_url: https://apmodel.readthedocs.io/
repo_url: https://github.com/AmaseCocoa/apmodel
repo_name: AmaseCocoa/apmodel

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Migration (0.5.x → 0.6.x): migration.md

docs_dir: docs
