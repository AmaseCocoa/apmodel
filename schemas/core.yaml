# yaml-language-server: $schema=./schema.json
imports:
  - path: "pydantic"
    name: "AnyUrl"

classes:
  Link:
    extends: null
    description: "Link"
    mixins:
    properties:
      href:
        type: "str | List[str] | None"
      rel:
        type: "AnyUrl | None"
  Object:
    extends: null
    description: "ActivityStreams 2.0 のすべてのオブジェクトの基底型"
    mixins:
    properties:
      id:
        description: "オブジェクトの一意な識別子 (URI)"
      attachment:
        description: "添付ファイルや関連リソース"
      attributedTo:
        description: "このオブジェクトの作成者、所有者、または責任者"
      audience:
        description: "対象となる聴衆"
      content:
        description: "オブジェクトの本文 (HTMLが含まれることが多い)"
      context:
        description: "オブジェクトが属するコンテキストやプロジェクト"
      name:
        description: "オブジェクトの名称またはタイトル"
      endTime:
        description: "終了時刻 (ISO 8601 形式)"
      generator:
        description: "このオブジェクトを生成したエンティティ（アプリケーション等）"
      icon:
        description: "オブジェクトを表すアイコン画像"
      image:
        description: "オブジェクトに関連付けられた画像"
      inReplyTo:
        description: "返信先のオブジェクト"
      location:
        description: "物理的または論理的な場所"
      preview:
        description: "オブジェクトのプレビューや要約表現"
      published:
        description: "公開日時 (ISO 8601 形式)"
      replies:
        description: "このオブジェクトに対する返信のコレクション"
      startTime:
        description: "開始時刻 (ISO 8601 形式)"
      summary:
        description: "オブジェクトの簡潔な要約（プレーンテキスト）"
      tag:
        description: "タグやハッシュタグ、メンション"
      updated:
        description: "最終更新日時 (ISO 8601 形式)"
      url:
        description: "オブジェクトのWebページURLまたはリンク"
      to:
        description: "主要な宛先"
      bto:
        description: "主要な宛先（ブラインド）"
      cc:
        description: "副次的な宛先"
      bcc:
        description: "副次的な宛先（ブラインド）"
      mediaType:
        description: "MIMEタイプ (例: text/html)"
      duration:
        description: "期間 (ISO 8601 Duration形式)"
  Activity:
    extends: Object
    isCoreType: true
    description: "Activity"
    mixins:
    properties:
      actor:
        description: "Activity の主体"
      object:
        type: "Object | str | None"
      target:
        type: "Object | str | None"
