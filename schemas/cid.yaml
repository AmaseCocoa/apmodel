# yaml-language-server: $schema=./schema.json
imports:

classes:
  DataIntegrityProof:
    extends: null
    isCoreType: false
    description: ""
    properties:
      cryptosuite: 
        type: str
      proofValue: 
        type: str
      proofPurpose: 
        type: str
      verificationMethod: 
        type: str
      created: 
        type: str | datetime
  Multikey:
    extends: null
    isCoreType: false
    description: ""
    mixins:
      - MultikeyMixin
    properties:
      id:
        type: str | None
      controller:
        description: Owner of this key.
        type: str | None
      publicKeyMultibase:
        description: multibase-formatted public key.
        type: str | None
      privateKeyMultibase:
        description: multibase-formatted private key.
        type: str | None