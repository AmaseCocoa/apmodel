# yaml-language-server: $schema=../schema.json
imports:

classes:
  Object:
    extends: null
    description: "ActivityStreams 2.0 のすべてのオブジェクトの基底型"
    
    mixins:

    properties:
      id: 
        type: "str | None"
        description: "オブジェクトの一意な識別子 (URI)"
      
      type: 
        type: "str | list[str]"
        description: "オブジェクトの型"
      
      attachment: 
        type: "Object | list[Object] | None"
      
      attributedTo: 
        type: "Object | str | list[Object | str] | None"
        description: "このオブジェクトの作成者や所有者"
        alias: attributedTo
        decode: |
                  match val:
                      case str():
                          return self._resolve_uri(val)
                      case dict():
                          return Object(val)
                      case list():
                          return [self._wrap_value(v) for v in val]
                      case _:
                          return val
      audience: 
        type: "Object | str | list[Object | str] | None"
      
      content: 
        type: "str | None"
        description: "オブジェクトの本文 (HTMLが含まれることが多い)"
      
      context: 
        type: "Object | str | None"
      
      name: 
        type: "str | None"
        description: "オブジェクトの名称またはタイトル"
      
      published: 
        type: "str | None"
      
      summary: 
        type: "str | None"
      
      url: 
        type: "str | list[str] | None"
      
      to: 
        type: "list[str | Object] | None"
      
      cc: 
        type: "list[str | Object] | None"
        