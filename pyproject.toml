[project]
name = "apmodel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AmaseCocoa", email = "cocoa@amase.cc" }
]
requires-python = ">=3.10"
dependencies = [
    "attrs>=25.4.0",
    "cattrs>=26.1.0",
    "msgspec>=0.20.0",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/apmodel",
    { src = "src/apmodel", target = "apkit.models" }
]
