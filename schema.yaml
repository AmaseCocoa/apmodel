# 全体で共通のメタデータ
metadata:
  target_package: "generated.models"
  base_class_path: "core.base.AS2Base"

# クラス定義
classes:
  # 基底となるObject型
  Object:
    extends: null  # AS2Baseを直接継承
    description: "AS2のすべてのオブジェクトの基底"
    properties:
      id: { type: "uri" }
      type: { type: "string" }
      name: { type: "string" }
      attachment: { type: "object_list" }
      attributedTo: { type: "uri_list" }
      url: { type: "uri" }

  # コンテンツ系
  Note:
    extends: Object
    mixins: ["NoteLogicMixin"] # 手書きロジックの注入用
    properties:
      content: { type: "string" }
      inReplyTo: { type: "uri" }

  # アクティビティ系
  Activity:
    extends: Object
    properties:
      actor: { type: "uri" }
      object: { type: "uri_or_object" }
      target: { type: "uri" }

  Create:
    extends: Activity
    properties: {} # 固有プロパティがない場合

  # アクター系
  Person:
    extends: Object
    properties:
      preferredUsername: { type: "string" }
      inbox: { type: "uri" }
      outbox: { type: "uri" }
      publicKey: { type: "object" } # 署名検証用